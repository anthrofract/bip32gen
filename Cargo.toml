[package]
name = "bip39gen"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
bip39 = { version = "2.2.2", features = ["zeroize"] }
clap = { version = "4.6.5", features = ["derive"] }
crypto-bigint = { version = "0.7.5", default-features = false, features = ["zeroize"] }
env_logger = "0.11.11"
getrandom = "0.4.3"
log = "0.4.33"
sha3 = { version = "0.12.0", features = ["zeroize"] }
zeroize = "1.9.0"
